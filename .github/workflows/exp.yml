name: Prueba ayudante Windows Hello
on: { push: { branches: [exp-hello] } }
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y probar
        shell: powershell
        run: |
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          $md = "$env:WINDIR\System32\WinMetadata"
          Get-ChildItem $md -Filter 'Windows.*.winmd' | Select-Object -First 30 | % Name | Write-Host
          & "$fw\csc.exe" /nologo /target:exe /platform:anycpu /out:winhello.exe /r:"$md\Windows.Security.winmd" /r:"$md\Windows.Foundation.winmd" /r:"$md\Windows.Storage.winmd" /r:"$fw\System.Runtime.WindowsRuntime.dll" /r:"$fw\Facades\System.Runtime.dll" /r:"$fw\Facades\System.Threading.Tasks.dll" build\winhello.cs
          Write-Host "compilado: $(Test-Path winhello.exe) $((Get-Item winhello.exe -ErrorAction SilentlyContinue).Length) bytes"
          Write-Host "check: $(.\winhello.exe check)"
          Write-Host "selftest: $(.\winhello.exe selftest aG9sYQ==)"
          Write-Host "sign: $(.\winhello.exe sign aG9sYQ==)"
