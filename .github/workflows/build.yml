name: Compilar para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas automáticas
        run: npm test
      - name: Windows Hello (compilar el ayudante y comprobarlo)
        shell: powershell
        run: |
          $args2 = node -e "console.log(JSON.stringify(require('./src/winhello.js').cscArgs('src\\winhello.cs','build\\winhello.exe')))" | ConvertFrom-Json
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" @args2
          if (-not (Test-Path build\winhello.exe)) { Write-Error "No se pudo compilar winhello.exe"; exit 1 }
          $c = .\build\winhello.exe check; $t = .\build\winhello.exe selftest aG9sYQ==
          Write-Host "check: $c | selftest: $t"
          if ($c -notmatch '"supported"' -or $t -notmatch 'aG9sYQ==') { Write-Error "El ayudante de Windows Hello no responde bien"; exit 1 }
      - name: Compilar (y firmar si hay certificado)
        shell: bash
        env:
          CERT: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then export WIN_CSC_LINK="$CERT" WIN_CSC_KEY_PASSWORD="$CERT_PASS"; echo "Firmando con certificado"; else echo "Sin certificado: se compila sin firmar"; fi
          npx electron-builder --win --x64 --publish never
      - name: Prueba de arranque en Windows
        shell: pwsh
        run: |
          $env:ECOS_SELFTEST_PTY = "1"
          $p = Start-Process -FilePath "dist\win-unpacked\Ecos.exe" -PassThru
          Start-Sleep -Seconds 25
          $vivo = -not $p.HasExited
          Write-Host "¿Sigue abierta tras 20 s?: $vivo"
          $log = Join-Path $env:APPDATA "Ecos\ecos.log"
          if (Test-Path $log) { Write-Host "--- ecos.log ---"; Get-Content $log }
          else { Write-Host "No se ha creado ecos.log" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Autocomprobaci.n terminal: (FALLO|ERROR)" -Quiet)) { Write-Error "La terminal integrada no funciona en Windows"; exit 1 }
          Get-Process Ecos -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $vivo) { Write-Error "Ecos se ha cerrado al arrancar (código $($p.ExitCode))"; exit 1 }
      - name: Versión
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          name: Ecos ${{ steps.v.outputs.version }}
          body: |
            **Recomendado: `Ecos-Setup-${{ steps.v.outputs.version }}.exe`** (instalador, se actualiza solo).
            Alternativa sin instalar: `Ecos-${{ steps.v.outputs.version }}-portable.exe` (no se actualiza sola).
            Windows SmartScreen avisará porque no está firmado: *Más información → Ejecutar de todas formas*.
          files: |
            dist/Ecos-Setup-*.exe
            dist/Ecos-Setup-*.exe.blockmap
            dist/Ecos-*-portable.exe
            dist/latest.yml
