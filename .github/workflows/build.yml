name: Compilar para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - name: Versión y nombre del ejecutable
        id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv "dist/Ecos $VERSION.exe" "dist/Ecos-$VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Ecos-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: Ecos ${{ steps.v.outputs.version }} (prueba)
          body: |
            **Descarga `Ecos-…exe`** (portable, no necesita instalación).
            Windows SmartScreen avisará porque no está firmado: *Más información → Ejecutar de todas formas*.
          files: |
            dist/Ecos-*.exe
            dist/*.zip
