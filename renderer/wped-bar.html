<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Ecos</title>
<style>
  :root { --bg:#f4f1ea; --fg:#1d1b16; --accent:#1f5c4a; --on:#fff; --err:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 14px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent); }
  .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg b { font-weight: 600; }
  .msg span { opacity: .75; margin-left: 8px; }
  .msg.err span { color: var(--err); opacity: 1; }
  button { font: inherit; height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); background: transparent; color: var(--fg); cursor: pointer; }
  button.main { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<div class="bar" role="toolbar">
  <div class="msg" id="msg" role="status" aria-live="polite"><b id="title"></b><span id="hint"></span></div>
  <button id="cancel" type="button"></button>
  <button id="done" type="button" class="main"></button>
</div>
<script src="wped-bar.js"></script>
</body>
</html>
